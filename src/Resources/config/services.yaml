services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $listPageSize: '%nowo_workflow.web_ui.list_page_size%'
            $templates: '%nowo_workflow.web_ui.templates%'

    Nowo\WorkflowBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../Entity/'
            - '../../Enum/'
            - '../../NowoWorkflowBundle.php'
            - '../../Controller/'
            # Explicit wiring only: the private entity manager services exist only in private mode (1.14), and the
            # DBAL middleware must never be autoconfigured onto every connection.
            - '../../Doctrine/'
            - '../../Http/'
            - '../../Internal/'
            - '../../Model/'

    # Routes stay opt-in (REQ-SF-004 rule 7): controllers are not autoconfigured, so the #[Route] classes never get
    # the `routing.controller` tag and a host `routing.controllers` import does not mount them without the prefix.
    Nowo\WorkflowBundle\Controller\:
        resource: '../../Controller/'
        autoconfigure: false
        tags: ['controller.service_arguments', 'container.service_subscriber']

    Nowo\WorkflowBundle\Repository\:
        resource: '../../Repository/'

    Nowo\WorkflowBundle\Command\:
        resource: '../../Command/'
        tags: ['console.command']

    Nowo\WorkflowBundle\Service\LocaleManager:
        arguments:
            $enabledLocales: '%nowo_workflow.web_ui.locales%'
            $defaultLocale: '%nowo_workflow.web_ui.default_locale%'

    Nowo\WorkflowBundle\Service\AllowAllWorkflowUiAccessChecker: ~

    Nowo\WorkflowBundle\Service\DenyAllWorkflowUiAccessChecker: ~

    # Fail-closed default aliases; WorkflowUiSecurityPass replaces them after extensions merge (1.14: the
    # framework-free port, and the deprecated port only for a class that implements it).
    Nowo\WorkflowBundle\Contract\WorkflowUiAccessPolicyInterface:
        alias: Nowo\WorkflowBundle\Service\DenyAllWorkflowUiAccessChecker

    Nowo\WorkflowBundle\Contract\WorkflowUiAccessCheckerInterface:
        alias: Nowo\WorkflowBundle\Service\DenyAllWorkflowUiAccessChecker

    Nowo\WorkflowBundle\EventListener\WorkflowUiAccessSubscriber:
        arguments:
            $accessChecker: null
            $enabled: '%nowo_workflow.web_ui.enabled%'
            $accessPolicy: '@Nowo\WorkflowBundle\Contract\WorkflowUiAccessPolicyInterface'
            $tokenStorage: '@?security.token_storage'

    # Deprecated 1.x Twig globals (nowo_workflow_layout_template, nowo_workflow_css_framework…), removed in 2.0.
    Nowo\WorkflowBundle\Twig\WorkflowExtension:
        arguments:
            $layoutTemplate: '%nowo_workflow.ui.layout_template%'
            $cssFramework: '%nowo_workflow.ui.css_framework%'
            $iconSet: '%nowo_workflow.ui.icon_set%'
            $formThemeFramework: '%nowo_workflow.ui.css_framework_override%'

    # UiKit view models of the admin pages (REQ-UI-003).
    Nowo\WorkflowBundle\View\WorkflowPageFactory:
        arguments:
            $layout: '%nowo_workflow.web_ui.layout_template%'
            $formThemeFramework: '%nowo_workflow.ui.css_framework_override%'

    Nowo\WorkflowBundle\Doctrine\TableNamePrefixer:
        arguments:
            $tablePrefix: '%nowo_workflow.table_prefix%'

    Nowo\WorkflowBundle\Doctrine\TablePrefixSubscriber:
        tags:
            - { name: doctrine.event_subscriber }

    # Built workflows dispatch the standard Symfony workflow events (guard, transition, completed, announce…).
    Nowo\WorkflowBundle\Service\DatabaseWorkflowRegistry:
        arguments:
            $eventDispatcher: '@?event_dispatcher'
            # A database slug equal to a framework.workflows name would share its workflow.<name>.* events.
            $frameworkWorkflowNames: '%nowo_workflow.framework_workflow_names%'

    Nowo\WorkflowBundle\Service\WorkflowApplicator:
        arguments:
            $flushAfterApply: '%nowo_workflow.runtime.flush_after_apply%'

    Nowo\WorkflowBundle\Contract\WorkflowRegistryInterface: '@Nowo\WorkflowBundle\Service\DatabaseWorkflowRegistry'

    # Form Kit injects FormOptionsMerger into tagged form types (FormOptionsMergerInjectorCompilerPass).
    Nowo\WorkflowBundle\Form\:
        resource: '../../Form/'
        exclude: '../../Form/DataTransformer/'
        tags: ['form.type']
