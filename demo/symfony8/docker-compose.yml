name: workflow-bundle-demo-symfony-8

services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workflow-symfony8-php
    working_dir: /app
    ports:
      - "${PORT:-8022}:80"
    volumes:
      - .:/app
      - ../..:/var/workflow-bundle
      - ./docker/frankenphp/Caddyfile.dev:/etc/frankenphp/Caddyfile.dev
      - ./docker/php-dev.ini:/usr/local/etc/php/conf.d/99-dev.ini:ro
      - composer-cache:/root/.composer/cache
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
      COMPOSER_MEMORY_LIMIT: "-1"
      COMPOSER_MAX_PARALLEL_HTTP: "4"
      APP_ENV: dev
      FRANKENPHP_MODE: ${FRANKENPHP_MODE:-worker}
      APP_DEBUG: "1"
      APP_SECRET: ${APP_SECRET:-demo-secret}
      # MySQL on the internal Docker network host `database` (REQ-DEMO-011; no host port, REQ-DEMO-006).
      DATABASE_URL: ${DATABASE_URL:-mysql://app:app@database:3306/app?serverVersion=8.4&charset=utf8mb4}
    # Mitigate Docker/WSL DNS failures resolving repo.packagist.org (composer curl error 6) — REQ-DEMO-009.
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
      - 1.0.0.1
    mem_limit: 2g
    networks:
      - workflow-demo-network
    depends_on:
      database:
        condition: service_healthy

  database:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app}
      MYSQL_USER: ${MYSQL_USER:-app}
      # Credentials come from the demo .env (copied from .env.example by `make up`); no literal in this file.
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?copy .env.example to .env (make up does it)}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?copy .env.example to .env (make up does it)}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    volumes:
      - database_data:/var/lib/mysql
    # REQ-DEMO-006: no `ports:` — the database is reachable only on the Docker network.
    expose:
      - "3306"
    networks:
      - workflow-demo-network

volumes:
  database_data:
  composer-cache:

networks:
  workflow-demo-network:
    driver: bridge
