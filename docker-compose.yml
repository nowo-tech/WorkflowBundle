name: workflow-bundle
services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: workflow-bundle-php
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/root/.composer/cache
      - coverage-data:/app/coverage
    environment:
      - COMPOSER_ALLOW_SUPERUSER=1
      # REQ-TEST-005: the real-server suite (group `database`) runs against the services below (passwordless, local only).
      - NOWO_WORKFLOW_TEST_MYSQL_URL=pdo-mysql://root@mysql:3306/workflow
      - NOWO_WORKFLOW_TEST_PGSQL_URL=pdo-pgsql://postgres@postgres:5432/workflow
    depends_on:
      mysql:
        condition: service_healthy
      postgres:
        condition: service_healthy
    command: ["tail", "-f", "/dev/null"]
    networks:
      - workflow-bundle-network

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: workflow
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h127.0.0.1", "-uroot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - workflow-bundle-network

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: workflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - workflow-bundle-network

volumes:
  composer-cache:
    driver: local
  coverage-data:
    driver: local

networks:
  workflow-bundle-network:
    driver: bridge
    ipam:
      config:
        - subnet: 10.250.81.0/24
