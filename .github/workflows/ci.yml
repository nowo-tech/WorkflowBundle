# CI: tests on PHP 8.2+ × Symfony 7.4, 8.1 (minimum minors per REQ-SF-002; composer floor is ^7.4).
# Release (incl. latest) is created by release.yml on tag push (v*).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  git-hygiene:
    name: Git history (no Cursor co-author)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check for Cursor co-author trailers (REQ-GIT-001)
        run: |
          chmod +x .scripts/check-no-cursor-coauthor.sh
          ./.scripts/check-no-cursor-coauthor.sh HEAD

  test:
    name: PHP ${{ matrix.php }} - Symfony ${{ matrix.symfony }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        # Symfony 8.0 reached end of maintenance (July 2026): its CI cell is dropped (REQ-SF-002); composer.json still allows ^8.0.
        symfony: ['7.4', '8.1']
        exclude:
          - php: '8.2'
            symfony: '8.1'
          - php: '8.3'
            symfony: '8.1'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: json
          coverage: pcov
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-symfony-${{ matrix.symfony }}-composer-
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Override Composer platform PHP (composer.json pins the minimum PHP for the lock)
        run: composer config platform.php "${{ matrix.php }}.99"

      # Since 1.21.0: SearchKit (PHP >= 8.3) is added on 8.3+ only (never in composer.json / composer.lock); the 8.2 cells
      # skip the SearchKit group's tests.
      - name: SearchKit (PHP >= 8.3)
        run: bash .github/ci/search-kit.sh

      - name: Install dependencies with Symfony ${{ matrix.symfony }}
        run: |
          composer require --dev \
            symfony/browser-kit:^${{ matrix.symfony }} \
            symfony/framework-bundle:^${{ matrix.symfony }} \
            --no-interaction --no-update
          composer require \
            symfony/config:^${{ matrix.symfony }} \
            symfony/dependency-injection:^${{ matrix.symfony }} \
            symfony/form:^${{ matrix.symfony }} \
            symfony/http-kernel:^${{ matrix.symfony }} \
            symfony/routing:^${{ matrix.symfony }} \
            symfony/security-csrf:^${{ matrix.symfony }} \
            symfony/translation:^${{ matrix.symfony }} \
            symfony/twig-bundle:^${{ matrix.symfony }} \
            symfony/validator:^${{ matrix.symfony }} \
            symfony/workflow:^${{ matrix.symfony }} \
            symfony/yaml:^${{ matrix.symfony }} \
            --no-interaction --no-update
          case "${{ matrix.symfony }}" in
            8.0|8.1)
              composer require doctrine/doctrine-bundle:^3.2.4 --no-interaction --no-update
              ;;
            *)
              composer require doctrine/doctrine-bundle:^2.13 --no-interaction --no-update
              ;;
          esac
          composer update symfony/* doctrine/doctrine-bundle ${SEARCH_KIT_PACKAGES:-} --with-all-dependencies --no-interaction --prefer-dist --no-progress
      - name: Composer audit (Critical/High)
        run: composer audit --locked


      - name: Run tests
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test

      # Since 1.21.0 on PHP 8.4 (was 8.2): SearchKit is installed there, so the SearchKit group counts.
      - name: Run tests with coverage (PHP 8.4 + Symfony 7.4 only; fails below 100%, REQ-TEST-003)
        if: matrix.php == '8.4' && matrix.symfony == '7.4'
        env:
          SYMFONY_DEPRECATIONS_HELPER: max[direct]=0
        run: composer test-coverage-100

  mysql-schema:
    # 1.15.2: the NO PAD key collation against real servers: migrations:diff stays clean, keys are exact.
    name: Schema round trip (${{ matrix.db }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        db: ['mysql:8.4', 'mariadb:11.4']

    services:
      database:
        image: ${{ matrix.db }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: workflow
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: workflow
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot || healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Collation round trip
        env:
          NOWO_WORKFLOW_TEST_MYSQL_URL: pdo-mysql://root:root@127.0.0.1:3306/workflow
        run: vendor/bin/phpunit --no-coverage --fail-on-skipped tests/Integration/Doctrine/MySqlNoPadCollationTest.php

      - name: Identity key collation gate (REQ-SEC-006)
        env:
          NOWO_WORKFLOW_TEST_MYSQL_URL: pdo-mysql://root:root@127.0.0.1:3306/workflow
        run: vendor/bin/phpunit --no-coverage --fail-on-skipped tests/Integration/Collation/WorkflowExactKeyColumnsTest.php

  pgsql-schema:
    # REQ-TEST-005: the schema and a definition round trip against a real PostgreSQL server.
    name: Schema round trip (postgres:16)
    runs-on: ubuntu-latest

    services:
      database:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: workflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PostgreSQL round trip
        env:
          NOWO_WORKFLOW_TEST_PGSQL_URL: pdo-pgsql://postgres@127.0.0.1:5432/workflow
        run: vendor/bin/phpunit --no-coverage --fail-on-skipped tests/Integration/Doctrine/PostgreSqlSchemaRoundTripTest.php

  databases:
    # REQ-RUNTIME-003: the two-connection race tests (applies, row locks, two processes, definition versions) against
    # real servers with real row locks, on DBAL 3 and DBAL 4. Required check on main.
    name: Databases (${{ matrix.db.image }}, DBAL ${{ matrix.dbal }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        dbal: ['3', '4']
        db:
          - image: 'mysql:8.4'
            port: 3306
            health: 'mysqladmin ping -h 127.0.0.1 -proot'
            url_var: NOWO_WORKFLOW_TEST_MYSQL_URL
            url: 'pdo-mysql://root:root@127.0.0.1:3306/workflow'
            test: tests/Integration/Concurrency/ConcurrentApplyMySqlTest.php
          - image: 'mariadb:11.4'
            port: 3306
            health: 'healthcheck.sh --connect --innodb_initialized'
            url_var: NOWO_WORKFLOW_TEST_MYSQL_URL
            url: 'pdo-mysql://root:root@127.0.0.1:3306/workflow'
            test: tests/Integration/Concurrency/ConcurrentApplyMySqlTest.php
          - image: 'postgres:16'
            port: 5432
            health: 'pg_isready -U postgres'
            url_var: NOWO_WORKFLOW_TEST_PGSQL_URL
            url: 'pdo-pgsql://postgres@127.0.0.1:5432/workflow'
            test: tests/Integration/Concurrency/ConcurrentApplyPostgreSqlTest.php

    services:
      database:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: workflow
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: workflow
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: workflow
        ports:
          - ${{ matrix.db.port }}:${{ matrix.db.port }}
        options: >-
          --health-cmd="${{ matrix.db.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Use DBAL 3
        if: matrix.dbal == '3'
        run: composer require doctrine/dbal:^3.8.2 --with-all-dependencies --no-interaction --no-progress

      - name: Race tests (REQ-RUNTIME-003)
        env:
          ${{ matrix.db.url_var }}: ${{ matrix.db.url }}
        run: vendor/bin/phpunit --no-coverage --fail-on-skipped ${{ matrix.db.test }}

  search-kit-databases:
    # Since 1.21.0: SearchKit's provider contract for the "workflow_requests" group on real servers (visibility, other
    # tenants, archived rows, the access event, LIKE escaping, the query budget). SearchKit needs PHP >= 8.3.
    name: SearchKit databases (${{ matrix.db.image }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        db:
          - image: 'mysql:8.4'
            port: 3306
            health: 'mysqladmin ping -h 127.0.0.1 -proot'
            url_var: NOWO_WORKFLOW_TEST_MYSQL_URL
            url: 'pdo-mysql://root:root@127.0.0.1:3306/workflow'
            test: tests/Integration/SearchKit/WorkflowRequestSearchMySqlContractTest.php
          - image: 'mariadb:11.4'
            port: 3306
            health: 'healthcheck.sh --connect --innodb_initialized'
            url_var: NOWO_WORKFLOW_TEST_MYSQL_URL
            url: 'pdo-mysql://root:root@127.0.0.1:3306/workflow'
            test: tests/Integration/SearchKit/WorkflowRequestSearchMySqlContractTest.php
          - image: 'postgres:16'
            port: 5432
            health: 'pg_isready -U postgres'
            url_var: NOWO_WORKFLOW_TEST_PGSQL_URL
            url: 'pdo-pgsql://postgres@127.0.0.1:5432/workflow'
            test: tests/Integration/SearchKit/WorkflowRequestSearchPostgreSqlContractTest.php

    services:
      database:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: workflow
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: workflow
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: workflow
        ports:
          - ${{ matrix.db.port }}:${{ matrix.db.port }}
        options: >-
          --health-cmd="${{ matrix.db.health }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: SearchKit (PHP >= 8.3)
        run: bash .github/ci/search-kit.sh --install

      - name: SearchKit contract
        env:
          ${{ matrix.db.url_var }}: ${{ matrix.db.url }}
        run: vendor/bin/phpunit --no-coverage --fail-on-skipped ${{ matrix.db.test }}

  cs-check:
    name: Code Style Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Check code style
        run: composer cs-check

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # Since 1.21.0: 8.4, so the SearchKit group is analysed (the dependency-floor job still runs PHPStan on 8.2).
          php-version: '8.4'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: SearchKit (PHP >= 8.3)
        run: bash .github/ci/search-kit.sh --install

      - name: PHPStan (level and ignoreErrors from phpstan.neon.dist; fails the build on any error)
        run: composer phpstan --no-interaction

      - name: Validate translations (syntax + 7 locales + key parity, REQ-MAKE-004)
        run: php scripts/validate-translations.php

  twig-lint:
    name: Twig lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Lint Twig templates (twig-cs-fixer)
        run: composer twig:lint

  igor:
    name: Igor (FrankenPHP worker audit)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Igor worker-state audit (REQ-CS-008)
        run: composer igor

  # Dependency floor: the code must work with the LOWEST nowo-tech/transaction-* versions composer.json allows (a host
  # can run `composer update nowo-tech/workflow-bundle` without updating them), and the demo lock must install what the
  # bundle requires (the demo installs from its lock, so a requirement added later is never installed and Demo smoke
  # fails with "class not found"). Same job as BreadcrumbKit (txd-constraint-1118).
  deps-floor:
    name: Dependency floor (nowo-tech/transaction-* lowest, demo lock)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Demo lock satisfies the bundle's nowo-tech requirements
        run: python3 .scripts/check-demo-lock.py . --only 'nowo-tech/*'

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Downgrade nowo-tech/transaction-* to the lowest allowed versions
        run: |
          composer update 'nowo-tech/transaction-*' --prefer-lowest --prefer-dist --no-progress --no-interaction
          composer show 'nowo-tech/transaction-*'

      - name: PHPStan at the floor
        run: composer phpstan

      - name: Tests at the floor
        timeout-minutes: 20
        run: composer test
